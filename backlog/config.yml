project_name: "ITPD Autochecker"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: []
definition_of_done: ["All acceptance criteria are satisfied", "`uv run pytest` passes", "`markdownlint-cli2` passes on the changed Markdown", "Implementation notes record the decisions made and the validation results"]
date_format: yyyy-mm-dd
max_column_width: 20
default_editor: "vim"
auto_open_browser: true
default_port: 6420
remote_operations: true
auto_commit: false
filesystem_only: false
zero_padded_ids: 3
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 90
task_prefix: "TASK"
